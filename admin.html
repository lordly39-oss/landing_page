  <main class="flex-1 w-full max-w-container-max mx-auto px-gutter py-10 flex flex-col justify-center">
    <div id="login-section" class="max-w-md w-full mx-auto bg-surface-container-lowest p-8 sm:p-10 rounded-3xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-border-subtle">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center text-primary mx-auto mb-4">
          <span class="material-symbols-outlined text-[32px]">admin_panel_settings</span>
        </div>
        <h1 class="text-2xl font-bold text-on-surface">관리자 로그인</h1>
        <p class="text-sm text-on-surface-variant mt-2">게시글 작성을 위해 관리자 비밀번호를 입력해 주세요.</p>
      </div>

        <div>
          <label class="block text-sm font-semibold text-on-surface mb-2">비밀번호</label>
          <input type="password" id="password-input" required placeholder="관리자 비밀번호" class="w-full h-12 px-4 rounded-xl border border-border-subtle bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/50 text-base">
        </div>

        <div id="login-error" class="hidden p-3 rounded-xl bg-error/10 text-error text-sm font-medium text-center">
          비밀번호가 올바르지 않습니다.
        </div>

        <button type="submit" class="w-full h-12 rounded-xl bg-primary text-on-primary font-semibold hover:bg-secondary transition-colors flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[20px]">login</span>

    </div>

    <div id="dashboard-section" class="hidden w-full space-y-8">

        <div>
          <h1 class="text-2xl font-bold text-on-surface">게시글 관리 대시보드</h1>
          <p class="text-sm text-on-surface-variant mt-1">부동산 소식 및 공지사항을 등록, 수정, 삭제할 수 있습니다.</p>
        </div>
        <div class="flex items-center gap-3">

            <span class="material-symbols-outlined text-[20px]">add</span>
            새 글 작성
          </a>

                <th class="py-4 px-6">작성일</th>
                <th class="py-4 px-6 text-center">관리</th>
              </tr>
            </thead>

              <tr>
                <td colspan="5" class="py-12 text-center text-on-surface-variant">게시글을 불러오는 중입니다...</td>

  <footer class="w-full py-6 border-t border-border-subtle bg-surface-container-lowest text-center text-xs text-on-surface-variant">

  </footer>

  <script src="db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loginSection = document.getElementById('login-section');
      const dashboardSection = document.getElementById('dashboard-section');
      const loginForm = document.getElementById('login-form');
      const loginError = document.getElementById('login-error');
      const passwordInput = document.getElementById('password-input');
      const logoutBtn = document.getElementById('logout-btn');

      if (isAdmin()) {
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        await loadDashboardPosts();
      } else {
        loginSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.classList.add('hidden');
        const inputPw = passwordInput.value.trim();

        try {
          const config = await loadConfig();
          const targetPw = config.admin_password || 'admin1234';

          if (inputPw === targetPw) {
            sessionStorage.setItem('isAdmin', 'true');
            window.location.reload();
          } else {
            loginError.classList.remove('hidden');
          }
        } catch (err) {
          loginError.textContent = '설정을 불러오지 못했습니다.';
          loginError.classList.remove('hidden');
        }
      });

      logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('isAdmin');
        window.location.reload();
      });
    });

    async function loadDashboardPosts() {
      const tbody = document.getElementById('post-table-body');
      const countEl = document.getElementById('post-count');

      try {
        const posts = await getPosts();
        countEl.textContent = `${posts.length}개`;

        if (posts.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="py-12 text-center text-on-surface-variant">작성된 게시글이 없습니다.</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = posts.map((post, idx) => `
          <tr class="hover:bg-surface-container/30 transition-colors">
            <td class="py-4 px-6 text-on-surface-variant/70 font-mono">${post.id || idx + 1}</td>
            <td class="py-4 px-6">
              <span class="px-2.5 py-1 rounded-md bg-secondary-container/10 text-secondary text-xs font-semibold">
                ${escapeHtml(post.category || '일반')}
              </span>
            </td>
            <td class="py-4 px-6 font-semibold text-on-surface">
              <a href="news-detail.html?id=${post.id}" class="hover:text-primary hover:underline">
                ${escapeHtml(post.title || '')}
              </a>
              ${post.isFeatured ? '<span class="ml-2 px-2 py-0.5 rounded text-[10px] bg-action-gold/20 text-tertiary font-bold">Featured</span>' : ''}
            </td>
            <td class="py-4 px-6 text-on-surface-variant text-xs font-mono">${escapeHtml(post.date || '')}</td>
            <td class="py-4 px-6 text-center">
              <div class="inline-flex items-center gap-2">
                <a href="news-write.html?id=${post.id}" class="px-3 py-1.5 rounded-lg bg-surface-container text-on-surface hover:bg-surface-variant text-xs font-semibold">
                  수정
                </a>
                <button onclick="handleDelete(${post.id})" class="px-3 py-1.5 rounded-lg bg-error/10 text-error hover:bg-error hover:text-on-error text-xs font-semibold transition-colors">
                  삭제
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-error">게시글 목록을 불러오지 못했습니다: ${err.message}</td>
          </tr>
        `;
      }
    }

    async function handleDelete(id) {
      if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
        try {
          await deletePost(id);
          alert('게시글이 삭제되었습니다.');
          await loadDashboardPosts();
        } catch (err) {
          alert('삭제 실패: ' + err.message);
        }
      }
    }
  </script>
